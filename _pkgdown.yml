url: https://mjfrigaard.github.io/gerp/
template:
  bootstrap: 5
  theme: arrow-dark
  bslib:
    bg: "#011627"           # Atomic Age dark navy, page background
    fg: "#cbcbcb"           # Atomic Age brushed aluminum, page text
    primary:   "#ff6f3c"   # Atomic Age rocket orange, links, buttons, navbar
    secondary: "#cbcbcb"   # Atomic Age brushed aluminum, neutral text emphasis
    success:   "#2ec4b6"   # Atomic Age teal
    info:      "#cbcbcb"   # Atomic Age brushed aluminum
    warning:   "#ffd23f"   # Atomic Age yellow
    danger:    "#ff6f3c"   # Atomic Age rocket orange, palette has no dedicated red
    code-color: "#cbcbcb"  # Atomic Age brushed aluminum, inline & block code text
    code-bg:    "#011627"  # Atomic Age dark navy, inline & block code background
    base_font:
      google: Ubuntu
    heading_font:
      google: Fira Sans Condensed
    code_font:
      google: Ubuntu Mono

navbar:
 bg: primary
 type: dark
 components:
   articles:
    text: Articles
    menu:
    - text: "Getting Started"
    - text: Where do I start?
      href: articles/getting-started.html
    - text: Create gerp projects
      href: articles/create.html
    - text: -------
    - text: "Workflows"
    - text: Setup
      href: articles/setup.html
    - text: Code
      href: articles/code.html
    - text: Data
      href: articles/data.html
    - text: Documents
      href: articles/documents.html
    - text: Naming workflow
      href: articles/workflow.html
    - text: -------
    - text: "Good Enough Practices"
    - text: Folder paths
      href: articles/paths.html
    - text: Naming objects & files
      href: articles/names.html
    - text: Batch renaming files
      href: articles/batch-rename.html

reference:
- title: "Function reference"
  desc: >
    Functions for creating gerp projects.
  contents:
  - grp_create
- title: "Folder functions"
  desc: "Functions for creating gerp folders & files."
  contents:
  - grp_setup
  - grp_code
  - grp_data
  - grp_dev
  - grp_report
- title: "Path functions"
  desc: "Functions for folder & file paths."
  contents:
  - grp_path
  - grp_root
  - grp_fpath
  - grp_lkp_path
- title: "Code functions"
  desc: "Functions for writing code."
  contents:
  - grp_headr
  - grp_sect
- title: "Naming functions"
  desc: "Functions for naming things."
  contents:
  - grp_name
  - grp_fname
  - grp_batch_rename
- title: "Data"
  desc: "Example datasets."
  contents:
  - wu_df
  - date_formats

development:
  mode: auto
